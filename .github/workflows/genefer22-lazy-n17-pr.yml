name: Genefer22 lazy GFN17 validation

on:
  push:
    branches:
      - perf/gpu-lazy-forward-n17-20261105
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libgmp-dev ocl-icd-opencl-dev python3

      - name: Run lazy-arithmetic exactness stress test
        run: python3 tests/check_gpu_lazy_n17.py

      - name: Build default-off GPU host binary
        run: |
          make -B -C genefer -f makefile_linux_x64 BOINC= \
            FLAGS_GPU="-O3 -DGPU -DGENEFER_GPU_LAZY_N17=0" ../bin/geneferg

      - name: Build opt-in GPU host binary
        run: |
          make -B -C genefer -f makefile_linux_x64 BOINC= \
            FLAGS_GPU="-O3 -DGPU -DGENEFER_GPU_LAZY_N17=1" ../bin/geneferg
